services:
  - type: web
    name: gomate-whatsapp-bot
    runtime: node
    plan: free
    region: singapore # Closest low-latency region for Indian users
    buildCommand: npm ci --only=production
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    # Persist WhatsApp Baileys auth across deploys & container restarts
    disk:
      name: baileys-auth
      mountPath: /opt/render/project/src/.baileys_auth
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      - key: ADMIN_PASSWORD
        value: gomate2026
      - key: RENDER_EXTERNAL_URL
        value: https://gomate-whatsapp-bot.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
