<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" width="100%" height="100%">
  <!-- GoMate Hexagon + Chevron Icon -->
  <g transform="translate(10, 10)">
    <!-- Dark Navy Hexagon Frame -->
    <path d="M40 0 L74.64 20 L74.64 60 L40 80 L5.36 60 L5.36 20 Z" 
          stroke="#0A1F44" 
          stroke-width="7" 
          stroke-linejoin="round"
          stroke-linecap="round"
          fill="none"/>
    <!-- Vibrant Agri Green Forward Chevron -->
    <path d="M22 24 L52 40 L22 56 L32 40 Z" 
          fill="#16A34A" 
          stroke="#16A34A" 
          stroke-width="2" 
          stroke-linejoin="round"/>
  </g>

  <!-- Wordmark "GoMate" in Space Grotesk Style -->
  <text x="110" y="58" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="700" fill="#0A1F44" letter-spacing="-1.5">Go<tspan fill="#16A34A">Mate</tspan></text>
  
  <!-- Tagline -->
  <text x="112" y="80" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="0.2">Book equipment in minutes</text>
</svg>
